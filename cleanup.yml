name: Discord Reaction Cleanup

on:
  schedule:
    - cron: "0 * * * *"   # 毎時0分に実行（UTC）
  workflow_dispatch:       # 手動実行も可能

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
